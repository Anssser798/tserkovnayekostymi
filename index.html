<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatFit — примерка костюмов</title>
    <style>
        /* ----- общие сбросы и шрифт ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2a1d18;
            background-image: url('ngels.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(42, 29, 24, 0.55);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 0;
        }

        .glass-card {
            position: relative;
            z-index: 1;
            max-width: 960px;
            width: 100%;
            background: rgba(42, 29, 24, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 36px 40px 40px;
            border: 1px solid rgba(123, 112, 88, 0.3);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(181, 141, 101, 0.08);
            transition: all 0.2s;
        }

        /* ----- шапка ----- */
        .header {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 12px;
        }

        .header-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .crest {
            flex-shrink: 0;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
        }

        .crest img {
            width: 100%;
            height: auto;
            display: block;
        }

        .header-text {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-top: 4px;
            align-items: center;
        }

        .header-text h1 {
            font-size: 28px;
            font-weight: 600;
            color: #b58d65;
            letter-spacing: -0.3px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            line-height: 1.2;
        }

        .header-text .badge {
            font-size: 14px;
            font-weight: 400;
            color: #7b7058;
            background: rgba(42, 29, 24, 0.5);
            padding: 2px 14px;
            border-radius: 30px;
            border: 1px solid rgba(123, 112, 88, 0.3);
            display: inline-block;
            align-self: flex-start;
        }

        .subtitle {
            color: #8d8374;
            font-size: 14px;
            padding-left: 16px;
            border-left: 3px solid #987652;
            opacity: 0.9;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            margin-bottom: 0;
        }

        /* ----- описание ----- */
        .description {
            color: #8d8374;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            padding: 0 2px;
        }

        .description a {
            color: #b58d65;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dashed #7b7058;
            transition: 0.2s;
        }

        .description a:hover {
            color: #d4b48c;
            border-bottom-color: #b58d65;
        }

        /* ----- основная сетка ----- */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 240px;
            gap: 32px;
            align-items: start;
        }

        /* ----- левая колонка (форма) ----- */
        .form-col {
            min-width: 0;
        }

        .field {
            margin-bottom: 22px;
        }

        .field label {
            display: block;
            font-size: 15px;
            font-weight: 500;
            color: #b58d65;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .field .hint {
            font-size: 13px;
            color: #7b7058;
            font-weight: 400;
            margin-left: 8px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-row input[type="number"],
        .input-row input[type="text"] {
            flex: 1;
            background: rgba(42, 29, 24, 0.7);
            border: 1px solid rgba(123, 112, 88, 0.4);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 18px;
            font-weight: 500;
            color: #e8ddd0;
            outline: none;
            transition: 0.25s;
            min-width: 0;
            width: 100%;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .input-row input[type="number"]:focus,
        .input-row input[type="text"]:focus {
            border-color: #b58d65;
            background: rgba(42, 29, 24, 0.9);
            box-shadow: 0 0 0 3px rgba(181, 141, 101, 0.2);
        }

        .input-row input[type="number"]:disabled,
        .input-row input[type="text"]:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(42, 29, 24, 0.4);
        }

        .input-row .unit {
            font-size: 15px;
            color: #7b7058;
            font-weight: 500;
            min-width: 22px;
        }

        .mode-toggle {
            display: inline-flex;
            background: rgba(42, 29, 24, 0.5);
            border-radius: 20px;
            padding: 2px;
            gap: 2px;
            flex-shrink: 0;
            margin-left: 4px;
        }

        .mode-btn {
            padding: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            color: #7b7058;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
            user-select: none;
            line-height: 1.4;
        }

        .mode-btn.active {
            background: #987652;
            color: #f5f0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .mode-btn:not(.active):hover {
            color: #b58d65;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding-left: 2px;
        }

        .checkbox-wrap input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #987652;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-wrap label {
            font-size: 14px;
            color: #8d8374;
            cursor: pointer;
            font-weight: 400;
            margin-bottom: 0;
        }

        .btn {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 18px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(145deg, #987652, #7b7058);
            color: #f5f0e0;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.5px;
            margin-top: 6px;
            box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.6);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 32px -10px rgba(0, 0, 0, 0.7);
            background: linear-gradient(145deg, #a8865e, #8a7b62);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 4px 14px -4px rgba(0, 0, 0, 0.5);
        }

        #result {
            margin-top: 28px;
            padding: 18px 22px;
            border-radius: 18px;
            background: rgba(42, 29, 24, 0.6);
            border: 1px solid rgba(123, 112, 88, 0.2);
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #result .placeholder {
            color: #7b7058;
            font-size: 15px;
            text-align: center;
            opacity: 0.8;
        }

        #result .success {
            color: #e8ddd0;
            font-size: 18px;
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
            width: 100%;
        }

        #result .success strong {
            color: #b58d65;
            font-weight: 700;
            background: rgba(123, 112, 88, 0.2);
            padding: 2px 12px;
            border-radius: 8px;
            display: inline-block;
            white-space: normal;
            word-break: break-word;
        }

        #result .error {
            color: #d4a08a;
            font-size: 16px;
            text-align: center;
            line-height: 1.5;
            width: 100%;
        }

        /* ----- правая колонка (кот + костюмы) ----- */
        .preview-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding-top: 4px;
        }

        .preview-col .preview-label {
            font-size: 13px;
            color: #7b7058;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
            align-self: flex-start;
            padding-left: 4px;
        }

        .cat-container {
            position: relative;
            width: 100px;
            height: 150px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(123, 112, 88, 0.35);
            background: #1f1512;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .cat-container canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cat-container .cat-base {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .cat-container .costume-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            transition: opacity 0.2s;
        }

        .cat-container .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7b7058;
            font-size: 12px;
            text-align: center;
            width: 80%;
            opacity: 0.7;
            pointer-events: none;
            line-height: 1.4;
        }

        .cat-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .cat-actions .btn-sm {
            padding: 8px 14px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            background: rgba(123, 112, 88, 0.25);
            color: #b58d65;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(123, 112, 88, 0.2);
            text-align: center;
        }

        .cat-actions .btn-sm:hover {
            background: rgba(123, 112, 88, 0.4);
            border-color: #b58d65;
            color: #d4b48c;
        }

        .cat-actions .btn-sm.primary {
            background: #987652;
            color: #f5f0e0;
            border-color: #987652;
        }

        .cat-actions .btn-sm.primary:hover {
            background: #a8865e;
            border-color: #b58d65;
        }

        /* ----- кастомный дропдаун костюмов ----- */
        .costume-dropdown-wrap {
            position: relative;
            width: 100%;
        }

        .costume-dropdown-btn {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid rgba(123, 112, 88, 0.3);
            border-radius: 14px;
            background: rgba(42, 29, 24, 0.7);
            color: #e8ddd0;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: 0.25s;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .costume-dropdown-btn:hover {
            border-color: #b58d65;
            background: rgba(42, 29, 24, 0.9);
        }

        .costume-dropdown-btn .arrow {
            font-size: 12px;
            color: #7b7058;
            transition: 0.2s;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .costume-dropdown-btn.open .arrow {
            transform: rotate(180deg);
        }

        .costume-dropdown-btn .selected-name {
            color: #b58d65;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .costume-dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: rgba(42, 29, 24, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(123, 112, 88, 0.25);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.7);
            max-height: 320px;
            overflow-y: auto;
            display: none;
            z-index: 20;
            padding: 6px 0;
        }

        .costume-dropdown-menu.open {
            display: block;
        }

        .costume-dropdown-menu .group-label {
            padding: 8px 16px 4px;
            font-size: 12px;
            font-weight: 700;
            color: #987652;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-top: 1px solid rgba(123, 112, 88, 0.15);
            margin-top: 4px;
        }

        .costume-dropdown-menu .group-label:first-child {
            border-top: none;
            margin-top: 0;
        }

        .costume-dropdown-menu .costume-item {
            padding: 8px 16px 8px 20px;
            font-size: 14px;
            color: #c4b8a8;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            border-left: 2px solid transparent;
        }

        .costume-dropdown-menu .costume-item:hover {
            background: rgba(123, 112, 88, 0.2);
            color: #e8ddd0;
            border-left-color: #b58d65;
        }

        .costume-dropdown-menu .costume-item.active {
            background: rgba(123, 112, 88, 0.25);
            color: #d4b48c;
            border-left-color: #987652;
        }

        .costume-dropdown-menu .costume-item .check {
            color: #987652;
            font-weight: 700;
            visibility: hidden;
        }

        .costume-dropdown-menu .costume-item.active .check {
            visibility: visible;
        }

        .costume-dropdown-menu::-webkit-scrollbar {
            width: 5px;
        }

        .costume-dropdown-menu::-webkit-scrollbar-track {
            background: rgba(42, 29, 24, 0.5);
            border-radius: 8px;
        }

        .costume-dropdown-menu::-webkit-scrollbar-thumb {
            background: #7b7058;
            border-radius: 8px;
        }

        .costume-dropdown-menu::-webkit-scrollbar-thumb:hover {
            background: #987652;
        }

        /* ----- скрытый input для загрузки файлов ----- */
        #fileInput {
            display: none;
        }

        #urlInput {
            display: none;
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(123, 112, 88, 0.3);
            background: rgba(42, 29, 24, 0.7);
            color: #e8ddd0;
            font-size: 13px;
            outline: none;
            transition: 0.25s;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        #urlInput:focus {
            border-color: #b58d65;
            background: rgba(42, 29, 24, 0.9);
        }

        #urlInput.show {
            display: block;
        }

        .cat-actions .btn-sm .icon {
            margin-right: 4px;
        }

        .costume-status {
            font-size: 12px;
            color: #7b7058;
            text-align: center;
            min-height: 18px;
            width: 100%;
        }

        .costume-status .highlight {
            color: #b58d65;
            font-weight: 500;
        }

        /* ----- адаптив ----- */
        @media (max-width: 820px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .preview-col {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding-top: 8px;
                border-top: 1px solid rgba(123, 112, 88, 0.15);
                padding-top: 20px;
            }

            .preview-col .preview-label {
                width: 100%;
                text-align: center;
                align-self: center;
            }

            .cat-container {
                width: 100px;
                height: 150px;
            }

            .cat-actions {
                flex: 1;
                min-width: 180px;
            }

            .costume-dropdown-menu {
                max-height: 260px;
            }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 20px 16px;
                border-radius: 28px;
            }

            .header {
                gap: 10px;
                flex-direction: column;
                align-items: center;
            }

            .header-right {
                width: 100%;
                text-align: center;
            }

            .subtitle {
                padding-left: 0;
                border-left: none;
                border-top: 3px solid #987652;
                padding-top: 8px;
            }

            .crest {
                width: 65px;
                height: 65px;
            }

            .header-text h1 {
                font-size: 22px;
            }

            .input-row input[type="number"],
            .input-row input[type="text"] {
                font-size: 16px;
                padding: 10px 14px;
            }

            #result .success {
                font-size: 16px;
            }

            .btn {
                font-size: 16px;
                padding: 14px 16px;
            }

            .description {
                font-size: 13px;
            }

            .mode-btn {
                font-size: 12px;
                padding: 3px 10px;
            }

            .main-grid {
                gap: 18px;
            }

            .preview-col {
                flex-direction: column;
                align-items: center;
            }

            .cat-actions {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>

<body>

    <div class="glass-card">
        <!-- Шапка -->
        <div class="header">
            <div class="crest">
                <img src="heal-light.png" alt="Герб" />
            </div>
            <div class="header-text">
                <h1>CatFit</h1>
                <div class="description">
                    Примерка костюмов на модельке кота. Загрузите окрас или попробуйте
                    подтянуть с <a href="#" id="catwarLink">catwar.ru</a>.
                    Выберите костюм из списка и он сам наложится поверх окраса.
                    <br>
                    <span style="color:#7b7058;font-size:13px;">
                        Костюмы отсортированы по отрядам. Нажмите на название, чтобы примерить.
                    </span>
                </div>
            </div>
        </div>

        <!-- Основная сетка -->
        <div class="main-grid">
            <!-- Левая колонка: форма -->
            <div class="form-col">
            
            <!-- Правая колонка: кот + костюмы -->
            <div class="preview-col">
                <span class="preview-label">✦ примерка</span>

                <!-- Контейнер кота 100x150 -->
                <div class="cat-container" id="catContainer">
                    <img class="cat-base" id="catBase" src="" alt="Окрас кота" style="display:none;" />
                    <img class="costume-overlay" id="costumeOverlay" src="" alt="Костюм" style="display:none;" />
                    <span class="placeholder-text" id="catPlaceholder">
                        загрузите<br />окрас
                    </span>
                </div>

                <!-- Действия -->
                <div class="cat-actions">
                    <button class="btn-sm primary" id="uploadBtn">
                        <span class="icon">⬆</span> Загрузить окрас
                    </button>
                    <input type="file" id="fileInput" accept="image/*" />

                    <button class="btn-sm" id="urlToggleBtn">
                        <span class="icon">!</span> Вставить URL
                    </button>
                    <input type="text" id="urlInput" placeholder="https://catwar.net/.../" />

                    <!-- Дропдаун костюмов -->
                    <div class="costume-dropdown-wrap">
                        <button class="costume-dropdown-btn" id="costumeDropdownBtn">
                            <span>
                                <span style="color:#7b7058;font-weight:400;">Костюм: </span>
                                <span class="selected-name" id="selectedCostumeName">не выбран</span>
                            </span>
                            <span class="arrow">▾</span>
                        </button>
                        <div class="costume-dropdown-menu" id="costumeDropdownMenu">
                            <!-- заполняется JS -->
                        </div>
                    </div>

                    <div class="costume-status" id="costumeStatus">
                        <span style="color:#7b7058;">Нажмите на костюм, чтобы примерить</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  1. ДАННЫЕ КОСТЮМОВ
        // ============================================================
        const costumeGroups = [{
            name: 'Ангелы Хранители',
            items: ['8432', '8422', '8420']
        }, {
            name: 'Исследователи (Помощники Целителей)',
            items: ['8429', '8426', '8425', '324']
        }, {
            name: 'Святая Инквизиция',
            items: ['8428', '8427', '8415']
        }, {
            name: 'Организаторы',
            items: ['8418', '8417', '8416']
        }, {
            name: 'Котята',
            items: ['8423d', '8423', '8421d', '8421']
        }];

        // Плоский список для быстрого доступа
        const allCostumes = [];
        costumeGroups.forEach(g => {
            g.items.forEach(id => {
                allCostumes.push({
                    id: id,
                    group: g.name,
                    path: 'kostymi/' + id + '.png',
                    label: id
                });
            });
        });

        // ============================================================
        //  2. СОСТОЯНИЕ
        // ============================================================
        const state = {
            catImageUrl: null, // загруженный окрас (dataURL или внешний URL)
            costumeId: null, // выбранный ID костюма
            isCostumeLoaded: false,
        };

        // ============================================================
        //  3. DOM-ссылки
        // ============================================================
        const catBase = document.getElementById('catBase');
        const costumeOverlay = document.getElementById('costumeOverlay');
        const catPlaceholder = document.getElementById('catPlaceholder');
        const catContainer = document.getElementById('catContainer');

        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const urlToggleBtn = document.getElementById('urlToggleBtn');
        const urlInput = document.getElementById('urlInput');

        const dropdownBtn = document.getElementById('costumeDropdownBtn');
        const dropdownMenu = document.getElementById('costumeDropdownMenu');
        const selectedName = document.getElementById('selectedCostumeName');
        const costumeStatus = document.getElementById('costumeStatus');

        // ============================================================
        //  4. ЗАГРУЗКА ОКРАСА
        // ============================================================

        // Загрузка через файл
        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const dataUrl = ev.target.result;
                setCatImage(dataUrl);
                fileInput.value = '';
            };
            reader.readAsDataURL(file);
        });

        // Переключение поля URL
        urlToggleBtn.addEventListener('click', () => {
            urlInput.classList.toggle('show');
            if (urlInput.classList.contains('show')) {
                urlInput.focus();
            }
        });

        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = urlInput.value.trim();
                if (val) {
                    setCatImage(val);
                    urlInput.classList.remove('show');
                    urlInput.value = '';
                }
            }
        });

        // Попытка подтянуть с catwar через ссылку в описании
        document.getElementById('catwarLink').addEventListener('click', (e) => {
            e.preventDefault();
            // Пытаемся загрузить стандартное изображение кота с catwar
            // Используем iframe-подход: пробуем разные варианты
            const urls = [
                'https://catwar.net/img/cat/current.png',
                'https://catwar.ru/img/cat/current.png',
                'https://catwar.net/profile',
                'https://catwar.ru/profile',
            ];
            // Просто показываем подсказку, как вставить URL
            urlInput.classList.toggle('show');
            if (urlInput.classList.contains('show')) {
                urlInput.placeholder = 'Вставьте прямую ссылку на изображение кота с catwar...';
                urlInput.focus();
            }
            costumeStatus.innerHTML = '<span style="color:#b58d65;">Вставьте ссылку на изображение кота с catwar</span>';
        });

        // Основная функция установки изображения кота
        function setCatImage(src) {
            if (!src) return;
            state.catImageUrl = src;
            catBase.src = src;
            catBase.style.display = 'block';
            catPlaceholder.style.display = 'none';
            // Сбрасываем костюм при смене окраса
            clearCostume();
            costumeStatus.innerHTML = '<span style="color:#7b7058;">Окрас загружен. Выберите костюм.</span>';
        }

        // ============================================================
        //  5. КОСТЮМЫ — ПОСТРОЕНИЕ МЕНЮ
        // ============================================================

        function buildDropdown() {
            dropdownMenu.innerHTML = '';
            costumeGroups.forEach((group, gi) => {
                const label = document.createElement('div');
                label.className = 'group-label';
                label.textContent = group.name;
                dropdownMenu.appendChild(label);

                group.items.forEach(id => {
                    const item = document.createElement('div');
                    item.className = 'costume-item';
                    item.dataset.id = id;
                    item.dataset.group = group.name;
                    item.innerHTML = `
                        <span class="check">✓</span>
                        <span>${id}</span>
                    `;
                    if (state.costumeId === id) {
                        item.classList.add('active');
                    }
                    item.addEventListener('click', () => {
                        selectCostume(id);
                    });
                    dropdownMenu.appendChild(item);
                });
            });
        }

        // ============================================================
        //  6. ВЫБОР КОСТЮМА
        // ============================================================

        function selectCostume(id) {
            const costume = allCostumes.find(c => c.id === id);
            if (!costume) return;

            state.costumeId = id;
            state.isCostumeLoaded = true;

            // Обновляем активный элемент в меню
            document.querySelectorAll('.costume-item').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });

            // Обновляем кнопку
            selectedName.textContent = id;

            // Загружаем изображение костюма
            const img = new Image();
            img.onload = () => {
                costumeOverlay.src = costume.path;
                costumeOverlay.style.display = 'block';
                costumeStatus.innerHTML = `
                    <span style="color:#b58d65;">✓</span>
                    <span class="highlight">${id}</span>
                    <span style="color:#7b7058;"> — ${costume.group}</span>
                `;
                // Закрываем дропдаун
                closeDropdown();
            };
            img.onerror = () => {
                costumeStatus.innerHTML = `
                    <span style="color:#d4a08a;">✗</span>
                    <span style="color:#d4a08a;">Не удалось загрузить ${id}.png</span>
                `;
                costumeOverlay.style.display = 'none';
                closeDropdown();
            };
            img.src = costume.path;

            // Показываем, что загружается
            costumeStatus.innerHTML = `<span style="color:#7b7058;">Загрузка ${id}...</span>`;
        }

        function clearCostume() {
            state.costumeId = null;
            state.isCostumeLoaded = false;
            costumeOverlay.src = '';
            costumeOverlay.style.display = 'none';
            selectedName.textContent = 'не выбран';
            document.querySelectorAll('.costume-item').forEach(el => {
                el.classList.remove('active');
            });
            // Не сбрасываем статус, если есть окрас
            if (state.catImageUrl) {
                costumeStatus.innerHTML = '<span style="color:#7b7058;">Выберите костюм из списка</span>';
            } else {
                costumeStatus.innerHTML = '<span style="color:#7b7058;">Сначала загрузите окрас</span>';
            }
        }

        // ============================================================
        //  7. ДРОПДАУН (открытие/закрытие)
        // ============================================================

        function toggleDropdown() {
            const isOpen = dropdownMenu.classList.contains('open');
            if (isOpen) {
                closeDropdown();
            } else {
                openDropdown();
            }
        }

        function openDropdown() {
            dropdownMenu.classList.add('open');
            dropdownBtn.classList.add('open');
        }

        function closeDropdown() {
            dropdownMenu.classList.remove('open');
            dropdownBtn.classList.remove('open');
        }

        dropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleDropdown();
        });

        document.addEventListener('click', (e) => {
            if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                closeDropdown();
            }
        });

       
        // ============================================================
        //  8. ИНИЦИАЛИЗАЦИЯ КОСТЮМОВ
        // ============================================================

        buildDropdown();

        // Если есть сохранённый выбор, восстанавливаем
        if (state.costumeId) {
            const c = allCostumes.find(c => c.id === state.costumeId);
            if (c) {
                selectedName.textContent = c.id;
                document.querySelectorAll('.costume-item').forEach(el => {
                    el.classList.toggle('active', el.dataset.id === state.costumeId);
                });
                // пробуем загрузить костюм
                const img = new Image();
                img.onload = () => {
                    costumeOverlay.src = c.path;
                    costumeOverlay.style.display = 'block';
                    costumeStatus.innerHTML = `
                        <span style="color:#b58d65;">✓</span>
                        <span class="highlight">${c.id}</span>
                        <span style="color:#7b7058;"> — ${c.group}</span>
                    `;
                };
                img.onerror = () => {
                    costumeOverlay.style.display = 'none';
                    costumeStatus.innerHTML = `<span style="color:#d4a08a;">Не удалось загрузить ${c.id}.png</span>`;
                };
                img.src = c.path;
            }
        }

        // ============================================================
        //  10. ДОПОЛНИТЕЛЬНО: попытка автозагрузки с catwar
        // ============================================================

        // Пытаемся загрузить изображение кота с catwar через iframe (не сработает из-за CORS)
        // поэтому просто показываем подсказку при клике на ссылку

        console.log('Загрузите окрас и примеряйте костюмы.');

        // ============================================================
        //  11. ОБРАБОТКА ПЕРЕТАСКИВАНИЯ (drag & drop) для окраса
        // ============================================================

        catContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            catContainer.style.borderColor = '#b58d65';
        });

        catContainer.addEventListener('dragleave', () => {
            catContainer.style.borderColor = 'rgba(123,112,88,0.35)';
        });

        catContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            catContainer.style.borderColor = 'rgba(123,112,88,0.35)';
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    setCatImage(ev.target.result);
                };
                reader.readAsDataURL(files[0]);
            }
        });
    </script>

</body>

</html>
